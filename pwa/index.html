<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UDCタイマー Ver.3</title>
<style>
:root{--udc:#1596b2;--dark:#0d6175;--deep:#073b48;--warn:#ffd54f;--over:#ff5252}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Yu Gothic UI','Meiryo',sans-serif;background:linear-gradient(135deg,var(--udc),var(--dark));color:white;min-height:100vh}body.warning{background:linear-gradient(135deg,#b98b00,#745900)}body.overtime{background:linear-gradient(135deg,#c62828,#691111)}.app{max-width:1220px;margin:auto;padding:24px}.header{display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:18px}.logo{width:92px;height:92px;object-fit:contain;border-radius:18px;background:#fff;box-shadow:0 8px 24px #0005}h1{margin:0;font-size:clamp(32px,4vw,58px);letter-spacing:.06em}.sub{opacity:.9}.timerPanel{text-align:center;margin-top:18px;padding:24px;border-radius:28px;background:#0004;border:1px solid #fff4;box-shadow:0 20px 60px #0004}.status{font-size:clamp(28px,4vw,50px);font-weight:700}.time{font-variant-numeric:tabular-nums;font-size:clamp(96px,16vw,210px);line-height:1;font-weight:300;text-shadow:0 8px 22px #0006}.elapsed{font-size:clamp(18px,2vw,28px);margin-top:10px}.bellStage{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:18px 0}.bellCard{width:138px;min-height:148px;border-radius:22px;background:#fff2;border:1px solid #fff4;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}.bellCard.off{opacity:.45}.bellImg{width:76px;height:76px;object-fit:contain;filter:drop-shadow(0 8px 12px #0006)}.bellCard.ringing{background:#fff6;box-shadow:0 0 44px #fff}.bellCard.ringing .bellImg,.logo.ringing{animation:ring .16s linear alternate infinite;filter:drop-shadow(0 0 18px #fff)}@keyframes ring{from{transform:scale(1.15) rotate(-8deg)}to{transform:scale(1.24) rotate(8deg)}}.bellLabel{margin-top:8px;font-weight:800}.controls{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:18px 0}button{font-size:19px;padding:12px 24px;border:0;border-radius:12px;background:#fff;color:var(--deep);font-weight:800;cursor:pointer;box-shadow:0 5px 0 #0003}button:active{transform:translateY(2px);box-shadow:0 3px 0 #0003}.settings{display:grid;grid-template-columns:repeat(2,minmax(330px,1fr));gap:16px;margin-top:18px}.panel{padding:18px;border-radius:20px;background:#0003;border:1px solid #fff3}.panel h2{margin:0 0 10px}.row{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin:9px 0}input,select{font-size:20px;padding:8px;border-radius:8px;border:0}input[type=number]{width:86px;text-align:right}.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.switch{position:relative;display:inline-block;width:64px;height:34px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;cursor:pointer;inset:0;background:#777;border-radius:34px;transition:.2s}.slider:before{content:"";position:absolute;height:26px;width:26px;left:4px;bottom:4px;background:white;border-radius:50%;transition:.2s}input:checked+.slider{background:#4ee39d}input:checked+.slider:before{transform:translateX(30px)}.small{font-size:14px;opacity:.9;line-height:1.55}.flash{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#fff4;font-size:clamp(52px,10vw,140px);font-weight:900;text-shadow:0 8px 30px #0007;z-index:10;pointer-events:none}.flash.show{display:flex;animation:fade .9s ease both}@keyframes fade{0%{opacity:0}15%{opacity:1}100%{opacity:0}}@media(max-width:800px){.settings{grid-template-columns:1fr}.header{align-items:flex-start}.logo{width:76px;height:76px}.bellCard{width:120px;min-height:128px}}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1596b2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></head><body><div id="flash" class="flash">ベル</div><div class="app"><div class="header"><div class="brand"><img id="logo" class="logo" src="../assets/udc_logo.png"><div><h1>UDCタイマー</h1><div class="sub">学会・口頭発表用ベル付きプレゼンタイマー Ver.3</div></div></div><button onclick="toggleFullScreen()">フルスクリーン</button></div>
<div class="timerPanel"><div id="status" class="status">残り</div><div id="mainTime" class="time">10:00</div><div id="elapsedTime" class="elapsed">経過時間 00:00</div><div class="bellStage" id="bellStage"></div><div class="controls"><button onclick="startTimer()">開始</button><button onclick="pauseTimer()">停止</button><button onclick="resetTimer()">リセット</button><button onclick="manualBell(1)">手動ベル1</button><button onclick="manualBell(4)">手動ベル4</button></div></div>
<div class="settings"><div class="panel"><h2>基本設定</h2><div class="row"><label>発表時間</label><div class="inline"><input id="totalMin" type="number" min="0" value="10">分 <input id="totalSec" type="number" min="0" max="59" value="0">秒</div></div><div class="row"><label>表示</label><select id="mode"><option value="remaining">残り時間</option><option value="elapsed">経過時間</option></select></div><div class="row"><label>音量</label><input id="volume" type="range" min="0" max="1" step="0.05" value="0.85"></div><div class="controls"><button onclick="applySettings()">設定反映</button><button onclick="saveSettings()">設定保存</button><button onclick="loadPreset(10)">10分</button><button onclick="loadPreset(12)">12分</button><button onclick="loadPreset(15)">15分</button></div><div class="small">0分0秒に設定したベルも、開始直後に鳴ります。各ベルはOFFにできます。</div></div><div class="panel"><h2>ベル設定</h2><div id="bellSettings"></div></div></div></div>
<script>
const qs=id=>document.getElementById(id);let total=600,elapsed=0,timer=null,running=false,lastTick=0;let bells=[{n:1,m:8,s:0,c:1,on:true,f:false},{n:2,m:10,s:0,c:2,on:true,f:false},{n:3,m:10,s:30,c:3,on:true,f:false},{n:4,m:11,s:0,c:8,on:true,f:false}];
function fmt(t){t=Math.max(0,Math.floor(t));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function renderBellUI(){qs('bellStage').innerHTML=bells.map(b=>`<div class="bellCard" id="bellCard${b.n}"><img class="bellImg" src="../assets/bell_image.png"><div class="bellLabel">ベル${b.n} / ${b.c}回</div><div class="small" id="bellTime${b.n}"></div></div>`).join('');qs('bellSettings').innerHTML=bells.map(b=>`<div class="row"><label>ベル${b.n}</label><div class="inline"><label class="switch"><input id="bell${b.n}On" type="checkbox" ${b.on?'checked':''}><span class="slider"></span></label><input id="bell${b.n}Min" type="number" min="0" value="${b.m}">分 <input id="bell${b.n}Sec" type="number" min="0" max="59" value="${b.s}">秒 <span>${b.c}回</span><button onclick="manualBell(${b.n})">試聴</button></div></div>`).join('')}
function readSettings(){total=(+qs('totalMin').value||0)*60+(+qs('totalSec').value||0);bells.forEach(b=>{b.m=+qs(`bell${b.n}Min`).value||0;b.s=+qs(`bell${b.n}Sec`).value||0;b.on=qs(`bell${b.n}On`).checked})}
function update(){let shown=qs('mode').value==='remaining'?total-elapsed:elapsed;qs('status').textContent=qs('mode').value==='remaining'?(elapsed>total?'超過':'残り'):'経過';qs('mainTime').textContent=fmt(shown);qs('elapsedTime').textContent='経過時間 '+fmt(elapsed);document.body.classList.toggle('warning',total-elapsed<=60&&elapsed<=total);document.body.classList.toggle('overtime',elapsed>total);bells.forEach(b=>{let card=qs('bellCard'+b.n); if(card){card.classList.toggle('off',!b.on);qs('bellTime'+b.n).textContent=fmt(b.m*60+b.s)}})}
const bellAudio=new Audio('../assets/bell.mp3');bellAudio.preload='auto';function beepOnce(){const a=bellAudio.cloneNode();a.volume=Number(qs('volume').value);a.play().catch(()=>{})}
async function ringBell(b){if(!b.on)return;qs('flash').textContent=`ベル${b.n} ${b.c}回`;qs('flash').classList.add('show');setTimeout(()=>qs('flash').classList.remove('show'),900);qs('logo').classList.add('ringing');qs('bellCard'+b.n)?.classList.add('ringing');for(let i=0;i<b.c;i++){beepOnce();await new Promise(r=>setTimeout(r,1000))}setTimeout(()=>{qs('logo').classList.remove('ringing');qs('bellCard'+b.n)?.classList.remove('ringing')},400)}
function checkBells(){bells.forEach(b=>{let t=b.m*60+b.s;if(b.on&&!b.f&&elapsed>=t){b.f=true;ringBell(b)}})}
function tick(){let now=Date.now();elapsed+=Math.floor((now-lastTick)/1000);lastTick+=Math.floor((now-lastTick)/1000)*1000;checkBells();update()}
function startTimer(){if(running)return;readSettings();running=true;lastTick=Date.now();checkBells();update();timer=setInterval(tick,250)}function pauseTimer(){running=false;clearInterval(timer)}function resetTimer(){pauseTimer();elapsed=0;bells.forEach(b=>b.f=false);update()}function applySettings(){readSettings();update();saveSettings()}function manualBell(n){readSettings();ringBell(bells.find(b=>b.n===n))}function loadPreset(m){qs('totalMin').value=m;qs('totalSec').value=0;applySettings()}function saveSettings(){localStorage.setItem('udcTimerV3',JSON.stringify({totalMin:qs('totalMin').value,totalSec:qs('totalSec').value,mode:qs('mode').value,volume:qs('volume').value,bells:bells.map(b=>({m:b.m,s:b.s,on:b.on}))}))}function loadSettings(){let s=localStorage.getItem('udcTimerV3');if(!s)return;try{s=JSON.parse(s);qs('totalMin').value=s.totalMin;qs('totalSec').value=s.totalSec;qs('mode').value=s.mode||'remaining';qs('volume').value=s.volume||.85;s.bells?.forEach((x,i)=>{if(bells[i])Object.assign(bells[i],x)})}catch(e){}}
function toggleFullScreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}renderBellUI();loadSettings();renderBellUI();readSettings();update();window.addEventListener('beforeunload',saveSettings);
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(console.warn);
</script></body></html>
