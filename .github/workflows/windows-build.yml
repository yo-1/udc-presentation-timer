name: Presentation Timer Windows build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r windows/requirements-build.txt
      - shell: pwsh
        run: pyinstaller --noconfirm --onefile --windowed --name PresentationTimer --add-data "assets/bell.mp3;assets" windows/udc_timer.py
      - uses: actions/upload-artifact@v4
        with:
          name: PresentationTimer_Windows
          path: dist/PresentationTimer.exe
